name: CI

# Vercel deploys the site. This workflow is the safety net: it builds on every
# push and pull request and checks the output, so a broken change is caught
# before (or alongside) the Vercel deploy.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Check the build output
        run: |
          set -e
          for f in index.html 404.html about/index.html contact/index.html projects/index.html sitemap-index.xml robots.txt favicon.svg og.png; do
            test -f "dist/$f" || { echo "missing from build: $f"; exit 1; }
          done
          test "$(ls dist/projects | grep -vc '^index.html$')" -ge 1 || { echo "no project pages were built"; exit 1; }
          grep -q 'rel="canonical" href="https://sanjaylagariya.vercel.app/' dist/index.html || { echo "canonical URL is not the primary domain"; exit 1; }
          if grep -rqE '\+91|tel:' dist --include=*.html; then echo "a phone number or tel: link is in the build"; exit 1; fi
          echo "build output looks right"
